<!doctype html>
<html lang="de">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>IT Support | Incident Demo</title>
    <link rel="stylesheet" href="assets/css/styles.css">
</head>

<body>
    <div class="topline"></div>
    <div class="app">
        <aside>
            <div class="brand">
                <div class="logo">IT</div><span>IT Support</span>
            </div>
            <nav class="nav" id="nav"></nav>
            <div class="aside-foot">Incident Demo · v1.0<br>Sample data only</div>
        </aside>
        <div class="main">
            <header class="topbar">
                <div class="search"><input id="globalSearch"
                        placeholder="Suche nach Incidents, Arbeitsplatz, Kategorie …"></div>
                <div class="topright"><button class="btn small" onclick="toggleLanguage()">DE / EN</button><select id="rolePicker" class="rolepicker" onchange="changeRole(this.value)" aria-label="Demo role"><option value="supporter">Supporter</option><option value="reporter">Reporter</option><option value="leader">Team leader</option></select><button class="bell" id="notificationBell" onclick="showNotifications()" aria-label="Notifications">🔔<span id="notificationCount" class="notification-count"></span></button><span class="who" id="currentUserLabel">Dimitrios Metozis</span><div class="avatar" id="currentAvatar">DM</div></div>
            </header>
            <main class="content" id="view"></main>
        </div>
    </div>
    <div id="toastroot"></div>
    <script defer src="assets/js/data/reference-data.js"></script>
    <script defer src="assets/js/data/seed-data.js"></script>
    <script defer src="assets/js/app.js"></script>
</body>

</html>
